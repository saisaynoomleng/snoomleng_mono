name: Build Next.js
description: Install dependencies, lint, and build Next.js

inputs:
  node_version:
    description: Current node.js version to run the build(e.g. 24.21.0)
    required: false
    default: "24.21.0"
  
runs-on:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node_version }}
    
    - name: Setup pnpm
      shell: bash
      run: corepack enable pnpm && corepack prepare pnpm --activate

    - name: Cache
      uses: actions/cache@v6
      with:
        path: |
          ~/.local/share/pnpm/store
          ${{ github.workspace }}/.next/cache
        key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
        restore-keys: |
          ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
    
    - name: Install pnpm
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Lint
      shell: bash
      run: pnpm lint

    - name: Build pnpm
      shell: bash
      run: pnpm build
