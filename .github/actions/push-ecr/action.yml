name: Push ECR
description: Push built docker image to AWS ECR

inputs:
  ecr-repo-uri:
    description: AWS ECR Repo URI
    required: true

  image-name:
    description: Docker image name
    required: false
    default: snoomleng/web

  image-tag:
    description: Docker image tag
    required: false
    default: latest

  container-name:
    description: Container Name
    required: false
    default: snoomleng/web:latest

  role-to-assume:
    description: GitHub AWS OIDC
    required: true

  aws-region:
    description: AWS REGION
    required: false
    default: us-east-2

runs:
  using: composite
  steps:
    - name: Configrue AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ inputs.aws-region }}
        role-to-assume: ${{ inputs.role-to-assume }}

    - name: Login to Amazon ECR
      shell: bash
      run: |
        aws ecr get-login-password --region ${{ inputs.aws-region }} | docker login --username AWS --password-stdin ${{ inputs.ecr-repo-uri }}

    - name: Tag Image
      shell: bash
      run: |
        docker tag \
        ${{ inputs.image-name }}:${{ inputs.image-tag }} \
        ${{ inputs.ecr-repo-uri }}/${{ inputs.container-name }}

    - name: Push Image
      shell: bash
      run: |
        docker push ${{ inputs.ecr-repo-uri }}/${{ inputs.container-name }}
