name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    environment: production
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_build.yml
    with:
      aws-region: us-east-2
      role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
      ecr-repo-uri: ${{ vars.ECR_REPO_URI }}
