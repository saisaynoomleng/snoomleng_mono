name: Build (reusable)

on:
  workflow_call:
    inputs:
      ecr-repo-uri:
        description: AWS ECR Repo URI
        required: true
        type: string

      image-name:
        description: Docker image name
        required: false
        default: snoomleng/web
        type: string

      image-tag:
        description: Docker image tag
        required: false
        default: latest
        type: string

      container-name:
        description: Container Name
        required: false
        default: snoomleng/web:latest
        type: string

      aws-region:
        description: AWS REGION
        required: false
        default: us-east-2
        type: string

      role-to-assume:
        description: GitHub OIDC AWS role
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker
        uses: ./.github/actions/build-docker
        with:
          image-name: ${{ inputs.image-name }}

      - name: Debug OIDC claims
        shell: bash
        run: |
          TOKEN=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')

          TOKEN="$TOKEN" python3 - <<'PY'
          import os, json, base64

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in ("iss", "aud", "sub"):
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Push to ECR
        uses: ./.github/actions/push-ecr
        with:
          role-to-assume: ${{ inputs.role-to-assume }}
          aws-region: ${{ inputs.aws-region }}
          ecr-repo-uri: ${{ inputs.ecr-repo-uri }}
          image-name: ${{ inputs.image-name }}
          image-tag: ${{ inputs.image-tag }}
          container-name: ${{ inputs.container-name }}
